<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>課題詳細  |  課題管理アプリケーション</title>
</head>
<body>
    <h1 class="mt-3">課題詳細</h1>
    <a href="./list.html" th:href="@{/issues}">一覧に戻る</a>
    <div>
        <h2 th:text="${issue.summary}" >(summry)</h2>
        <p th:text="${issue.description}">(description)</p>
    </div>
    <div class="d-flex gap-2">
    <a th:href="@{/issues/{issueId}/edit(issueId=${issue.id})}" class="btn btn-primary">編集</a>
    <form th:action="@{/issues/{issueId}/delete(issueId=${issue.id})}" method="post">
        <button class="btn btn-danger">削除</button>
    </form>
    </div>

    
</body>
</html>
